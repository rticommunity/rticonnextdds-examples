# Forward Log4j events to DDS. The application owns the shutdown sequence.
status = warn
name = DistributedLoggerReference
shutdownHook = disable

# Discover the custom plugin and give this appender its configuration name.
appender.dds.type = DDSAppender
appender.dds.name = DDS
# Set Distributed Logger options before any code creates its shared instance.
appender.dds.configureDistLogger = true
appender.dds.domainId = 0
appender.dds.applicationKind = Log4jReference
# Both this filter and the root logger level must allow a message.
appender.dds.filterLevel = INFO
# Report forwarding errors through Log4j without throwing them to the caller.
appender.dds.ignoreExceptions = true
# Include the timestamp, level, thread, logger, message, and exception details.
appender.dds.layout.type = PatternLayout
appender.dds.layout.pattern = %d{ISO8601} %-5level [%t] %logger - %msg%n%ex{full}

# Send INFO and higher-severity events from the root logger to the DDS appender.
rootLogger.level = INFO
rootLogger.appenderRef.dds.ref = DDS